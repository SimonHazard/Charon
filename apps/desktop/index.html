
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charon</title>
    <script>
      (() => {
        try {
          const value = localStorage.getItem('charon:theme:v1');
          const theme = ['light', 'dark'].includes(value) ? value : 'light';
          document.documentElement.dataset.theme = theme;
          const storedLocale = localStorage.getItem('PARAGLIDE_LOCALE');
          document.documentElement.lang = ['en', 'fr'].includes(storedLocale)
            ? storedLocale
            : 'en';
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
