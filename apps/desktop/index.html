
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charon</title>
    <script>
      (() => {
        const root = document.documentElement;
        const paint = (preference) => {
          const dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          // The resolved --canvas values; applyTheme hands the canvas back to the stylesheet.
          root.style.backgroundColor = dark ? '#171221' : '#ebeae8';
        };
        try {
          const value = localStorage.getItem('charon:theme:v1');
          paint(
            value === null ? 'system' : ['system', 'light', 'dark'].includes(value) ? value : 'light',
          );
          const storedLocale = localStorage.getItem('PARAGLIDE_LOCALE');
          root.lang = ['en', 'fr'].includes(storedLocale) ? storedLocale : 'en';
        } catch {
          paint('system');
          root.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
