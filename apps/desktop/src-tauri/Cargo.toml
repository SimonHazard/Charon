[package]
name = "charon-desktop"
version = "0.0.0"
description = "Free local-first capture shelf for agent-ready Markdown"
authors = ["Simon Hazard"]
homepage = "https://github.com/SimonHazard/Charon"
repository = "https://github.com/SimonHazard/Charon"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "charon_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "Charon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
notify = "=8.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"
thiserror = "=2.0.19"
ts-rs = "=12.0.1"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSObject", "NSString", "std"] }
