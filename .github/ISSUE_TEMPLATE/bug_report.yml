name: Bug report
description: Report a reproducible Charon defect without sharing captured content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include Note text, selected text, clipboard contents, Attachment bytes, secrets, tokens, or sensitive paths.
  - type: input
    id: version
    attributes:
      label: Charon version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and desktop session
      placeholder: macOS 15.6, Windows 11, Ubuntu 24.04 X11, or Fedora 43 Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed user content, clipboard data, secrets, tokens, and sensitive paths.
          required: true
