name: Quality

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/desktop/**'
      - 'packages/theme/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/desktop/**'
      - 'packages/theme/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-09
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux desktop build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/desktop test
      - run: bun run --cwd apps/desktop build
      - run: bun scripts/check-privacy.ts apps/desktop/dist
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: bun run bindings:check
      - run: bunx playwright install --with-deps chromium
      - name: Run Chromium desktop journeys
        run: bun run --cwd apps/desktop test:e2e -- --project=chromium
        env:
          CHARON_DESKTOP_ONLY_E2E: '1'
