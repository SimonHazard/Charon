name: Protected unsigned release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the verification gate only, without building or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-15
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-09
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run verify:release
      - run: bun scripts/check-release-version.ts

  # ADR 0014: Charon ships unsigned. This job holds no Apple, Authenticode, or
  # updater credential. macOS bundles keep Tauri's ad-hoc identity, so published
  # SHA-256 checksums are the only integrity evidence a user can check.
  draft-macos:
    if: github.event_name == 'push' || inputs.dry_run == false
    needs: gate
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-09
      - run: bun install --frozen-lockfile
      - name: Build ad-hoc macOS bundles and create the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin ad-hoc identity here as well as in tauri.conf.json, so a changed
          # config cannot make the release attempt a signature that cannot exist.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          args: --bundles app,dmg
          tagName: v__VERSION__
          releaseName: Charon v__VERSION__
          releaseBody: |
            See the checked-in changelog and the attached `SHA256SUMS.txt`.

            This macOS build is ad-hoc signed. It is not a Developer ID build
            and it is not notarized by Apple. Verify the download against the
            attached checksum before installing.

            macOS blocks the first launch of a downloaded build. Open it through
            System Settings, Privacy & Security, Open Anyway on macOS 15 and
            later, or Control-click, Open on macOS 14.

            Because the bundle is ad-hoc signed, macOS treats each version as a
            different application: grant Input Monitoring and Accessibility
            again after updating, or capture will not work.
          releaseDraft: true
          prerelease: false
      - name: Publish SHA-256 checksums beside the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          : > SHA256SUMS.txt
          found=0
          for artifact in "$bundle"/*/*.dmg "$bundle"/*/*.tar.gz; do
            [ -f "$artifact" ] || continue
            ( cd "$(dirname "$artifact")" && shasum -a 256 "$(basename "$artifact")" ) >> SHA256SUMS.txt
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "no publishable artifact found under $bundle" >&2
            exit 1
          fi
          cat SHA256SUMS.txt
          version="$(bun -e 'console.log((await Bun.file("apps/desktop/src-tauri/tauri.conf.json").json()).version)')"
          gh release upload "v${version}" SHA256SUMS.txt --clobber
