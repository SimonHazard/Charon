name: Release desktop

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.availability.outputs.should_release }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Read and validate the manifest version
        id: version
        run: |
          set -euo pipefail
          version="$(bun scripts/check-release-version.ts)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Decide whether this version needs a release
        id: availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" == "true" ]]; then
              echo "draft release $RELEASE_TAG already exists; publish a new patch version" >&2
              exit 1
            fi
            echo "release $RELEASE_TAG already exists; nothing to publish"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG exists without a release; publish a new patch version" >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  gate:
    if: needs.detect.outputs.should_release == 'true'
    needs: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-09
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run test:release
      - run: bun run check:workflows
      - run: bun run build
      - run: bun run check:privacy
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  build:
    if: needs.detect.outputs.should_release == 'true'
    needs:
      - detect
      - gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-aarch64
            bundles: app,dmg
            paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: ubuntu-24.04
            artifact: linux-x86_64
            bundles: deb,appimage,rpm
            paths: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-2025
            artifact: windows-x86_64
            bundles: nsis,msi
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: release
    env:
      MACOS_SIGNING_IDENTITY: Charon Release Signing
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-09
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - name: Assert Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "arm64"
      # ADR 0018: one stable self-signed identity keeps TCC grants across updates.
      # Tauri's own certificate import only accepts Apple-issued names, so the
      # workflow imports and trusts the certificate itself on this ephemeral runner.
      - name: Import the stable macOS signing identity
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_SIGNING_P12" || -z "$MACOS_SIGNING_P12_PASSWORD" ]]; then
            echo "macOS signing secrets are missing; refusing an ad-hoc release" >&2
            exit 1
          fi
          work="$RUNNER_TEMP/macos-signing"
          keychain="$RUNNER_TEMP/charon-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 24)"
          mkdir -p "$work"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$work/identity.p12"
          /usr/bin/openssl pkcs12 -in "$work/identity.p12" -clcerts -nokeys -passin env:MACOS_SIGNING_P12_PASSWORD -out "$work/identity.pem"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/identity.p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$work/identity.pem"
          if ! security find-identity -v -p codesigning "$keychain" | grep -Fq "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "the imported certificate is not a valid code-signing identity named $MACOS_SIGNING_IDENTITY" >&2
            exit 1
          fi
          fingerprint="$(/usr/bin/openssl x509 -in "$work/identity.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          echo "MACOS_SIGNING_SHA1=$fingerprint" >> "$GITHUB_ENV"
          rm -f "$work/identity.p12"
      - name: Build installers and signed updater artifacts
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
          BUNDLE_TARGETS: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run --cwd apps/desktop tauri:build -- --bundles "$BUNDLE_TARGETS" -- --locked
      - name: Verify the stable macOS designated requirement
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement="$(codesign -d -r - "$app" 2>&1)"
          echo "$requirement"
          if grep -q 'cdhash' <<< "$requirement"; then
            echo "the app has an ad-hoc designated requirement; TCC grants would not survive updates" >&2
            exit 1
          fi
          grep -Fq 'identifier "dev.simonhazard.charon"' <<< "$requirement"
          grep -Fqi "$MACOS_SIGNING_SHA1" <<< "$requirement"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.detect.outputs.should_release == 'true'
    needs:
      - detect
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: incoming
      - name: Verify and assemble the complete release
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: bun scripts/release-artifacts.ts --input incoming --output release-assets --notes-file release-notes.md --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION"
      - name: Publish only after every asset is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$RELEASE_SHA" --draft --title "Charon $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
